
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Discover companies registered on Kerjiva Malaysia and view their published job counts.">
  <title>Companies - Kerjiva Malaysia</title>

  <link rel="icon" href="kerjiva.jpg.png">
  <link rel="stylesheet" href="styles.css">

  <style>
    .companies-page {
      min-height: 100vh;
      background: #f5f8fc;
      padding-bottom: 40px;
    }

    .companies-header {
      background: #fff;
      border-bottom: 1px solid #e5eaf1;
      padding: 16px 0;
    }

    .companies-header-inner {
      max-width: 1100px;
      width: 92%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .companies-logo {
      color: #123b6d;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .companies-logo small {
      display: block;
      color: #f28c28;
      font-size: 11px;
      font-weight: 700;
      margin-top: -3px;
    }

    .companies-home-link {
      color: #123b6d;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .companies-home-link:hover {
      color: #f28c28;
    }

    .companies-main {
      max-width: 1000px;
      width: 92%;
      margin: 35px auto;
    }

    .companies-hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .companies-hero h1 {
      color: #123b6d;
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .companies-hero p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    }

    .companies-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 35px;
    }

    .companies-stat-card {
      background: #fff;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(15, 35, 65, 0.04);
    }

    .companies-stat-number {
      color: #123b6d;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .companies-stat-label {
      color: #64748b;
      font-size: 14px;
    }

    .companies-section-title {
      color: #123b6d;
      font-size: 21px;
      font-weight: 800;
      margin: 0 0 18px;
    }

    .companies-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .company-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: #fff;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(15, 35, 65, 0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .company-card:hover {
      border-color: #c5d5e8;
      box-shadow: 0 5px 16px rgba(15, 35, 65, 0.07);
    }

    .company-logo {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      object-fit: contain;
      border: 1px solid #edf0f5;
      border-radius: 10px;
      background: #fff;
      padding: 5px;
    }

    .company-logo-placeholder {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #edf3fa;
      color: #123b6d;
      font-size: 25px;
      font-weight: 800;
    }

    .company-info {
      min-width: 0;
      flex: 1;
    }

    .company-name {
      color: #123b6d;
      font-size: 16px;
      font-weight: 800;
      overflow-wrap: anywhere;
      margin-bottom: 8px;
    }

    .company-job-count {
      display: inline-block;
      color: #2563a6;
      background: #edf5ff;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .companies-message {
      background: #fff;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      padding: 25px 18px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .companies-footer {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      padding: 25px 15px;
    }

    @media (max-width: 600px) {
      .companies-main {
        margin-top: 25px;
      }

      .companies-hero h1 {
        font-size: 25px;
      }

      .companies-hero p {
        font-size: 14px;
      }

      .companies-stats {
        gap: 10px;
        margin-bottom: 28px;
      }

      .companies-stat-card {
        padding: 17px 10px;
      }

      .companies-stat-number {
        font-size: 25px;
      }

      .companies-stat-label {
        font-size: 12px;
      }

      .companies-section-title {
        font-size: 19px;
      }

      .companies-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .company-card {
        padding: 16px;
        gap: 13px;
      }

      .company-logo,
      .company-logo-placeholder {
        width: 58px;
        height: 58px;
      }

      .company-name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="companies-page">

  <header class="companies-header">
    <div class="companies-header-inner">

      <a href="index.html" class="companies-logo">
        Kerjiva
        <small>Malaysia</small>
      </a>

      <a href="index.html"
         class="companies-home-link"
         data-company-text="home">
        Home
      </a>

    </div>
  </header>

  <main class="companies-main">

    <section class="companies-hero">
      <h1 data-company-text="title">Companies</h1>

      <p data-company-text="subtitle">
        Discover companies registered on Kerjiva Malaysia.
      </p>
    </section>

    <section class="companies-stats">

      <div class="companies-stat-card">
        <div class="companies-stat-number" id="totalCompanies">-</div>
        <div class="companies-stat-label"
             data-company-text="totalCompanies">
          Total Companies
        </div>
      </div>

      <div class="companies-stat-card">
        <div class="companies-stat-number" id="totalPublishedJobs">-</div>
        <div class="companies-stat-label"
             data-company-text="totalJobs">
          Published Jobs
        </div>
      </div>

    </section>

    <section>

      <h2 class="companies-section-title"
          data-company-text="listTitle">
        Explore Companies
      </h2>

      <div id="companiesMessage"
           class="companies-message"
           data-company-text="loading">
        Loading companies...
      </div>

      <div id="companiesGrid" class="companies-grid"></div>

    </section>

  </main>

  <footer class="companies-footer">
    © <span id="companiesYear"></span> Kerjiva Malaysia
  </footer>

</div>

<!-- SUPABASE & WEBSITE SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="language.js"></script>

<script>
(function () {
  "use strict";

  const supabaseAuth = window.supabaseAuth;
  const languageKey = "kerjivaMalaysiaLanguage";

  const translations = {
    en: {
      home: "Home",
      title: "Companies",
      subtitle: "Discover companies registered on Kerjiva Malaysia.",
      totalCompanies: "Total Companies",
      totalJobs: "Published Jobs",
      listTitle: "Explore Companies",
      loading: "Loading companies...",
      noCompanies: "No companies with published jobs yet.",
      loadError: "Unable to load companies. Please try again later.",
      jobCount: "published jobs"
    },

    ms: {
      home: "Laman Utama",
      title: "Syarikat",
      subtitle: "Kenali syarikat yang berdaftar di Kerjiva Malaysia.",
      totalCompanies: "Jumlah Syarikat",
      totalJobs: "Jawatan Diiklankan",
      listTitle: "Terokai Syarikat",
      loading: "Sedang memuatkan syarikat...",
      noCompanies: "Belum ada syarikat dengan jawatan yang diiklankan.",
      loadError: "Syarikat tidak dapat dimuatkan. Sila cuba lagi.",
      jobCount: "jawatan diiklankan"
    }
  };

  function getLanguage() {
    return localStorage.getItem(languageKey) === "ms" ? "ms" : "en";
  }

  function t(key) {
    return translations[getLanguage()][key] ||
           translations.en[key] ||
           key;
  }

  const companiesGrid = document.getElementById("companiesGrid");
  const companiesMessage = document.getElementById("companiesMessage");

  let companiesData = [];

  document.getElementById("companiesYear").textContent =
    new Date().getFullYear();

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character];
    });
  }

  function applyPageLanguage() {
    document.documentElement.lang = getLanguage();

    document.querySelectorAll("[data-company-text]").forEach(function (element) {
      const key = element.getAttribute("data-company-text");
      element.textContent = t(key);
    });

    renderCompanies();
  }

  async function loadStatistics() {
    const { data, error } = await supabaseAuth
      .from("company_directory_stats")
      .select("total_companies,total_published_jobs")
      .single();

    if (error) {
      console.error("Companies statistics error:", error);
      return;
    }

    document.getElementById("totalCompanies").textContent =
      data.total_companies ?? 0;

    document.getElementById("totalPublishedJobs").textContent =
      data.total_published_jobs ?? 0;
  }

  function renderCompanies() {
    companiesGrid.innerHTML = "";

    companiesData.forEach(function (company) {
      const card = document.createElement("article");
      card.className = "company-card";

      const logo = company.logo_url
        ? '<img class="company-logo" src="' +
          escapeHTML(company.logo_url) +
          '" alt="' + escapeHTML(company.company_name) + ' logo">'
        : '<div class="company-logo-placeholder">' +
          escapeHTML((company.company_name || "C").charAt(0).toUpperCase()) +
          '</div>';

      card.innerHTML =
        logo +
        '<div class="company-info">' +
          '<div class="company-name">' +
            escapeHTML(company.company_name) +
          '</div>' +
          '<div class="company-job-count">' +
            Number(company.published_jobs_count || 0) +
            " " + escapeHTML(t("jobCount")) +
          '</div>' +
        '</div>';

      companiesGrid.appendChild(card);
    });
  }

  async function loadCompanies() {
    const { data, error } = await supabaseAuth
      .from("company_directory")
      .select("id,company_name,logo_url,published_jobs_count")
      .order("company_name", { ascending: true });

    if (error) {
      console.error("Companies directory error:", error);
      companiesMessage.hidden = false;
      companiesMessage.textContent = t("loadError");
      return;
    }

    companiesData = data || [];

    companiesMessage.hidden = companiesData.length > 0;

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }

    renderCompanies();
  }

  function refreshLanguage() {
    applyPageLanguage();

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }
  }

  window.addEventListener("storage", function (event) {
    if (event.key === languageKey) {
      refreshLanguage();
    }
  });

  applyPageLanguage();

  if (supabaseAuth) {
    Promise.all([
      loadStatistics(),
      loadCompanies()
    ]);
  } else {
    companiesMessage.hidden = false;
    companiesMessage.textContent = t("loadError");
    console.error("Supabase client is not available.");
  }

})();
</script>

</body>
</html>
