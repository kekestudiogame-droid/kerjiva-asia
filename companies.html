
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Discover companies registered on Kerjiva Malaysia and explore their published job opportunities.">
  <meta name="theme-color" content="#123b6d">

  <title>Companies - Kerjiva Malaysia</title>


<style>
  :root {
    --primary: #123b6d;
    --primary-light: #1d548d;
    --accent: #f28c28;
    --page-bg: #f5f7fb;
    --text: #243449;
    --muted: #718096;
    --white: #ffffff;
    --border: #e7edf4;
    --shadow: 0 8px 28px rgba(18, 59, 109, 0.07);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 10% 5%, rgba(29, 84, 141, 0.055), transparent 28%),
      var(--page-bg);
    color: var(--text);
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .companies-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .companies-header {
    position: relative;
    z-index: 2;
    width: 100%;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 3px 15px rgba(18, 59, 109, 0.035);
  }

  .companies-header-inner {
    width: min(1120px, calc(100% - 40px));
    min-height: 76px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .companies-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--primary);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.7px;
  }

  .companies-brand-mark {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: linear-gradient(145deg, #174d82, #0d315b);
    color: var(--white);
    font-size: 19px;
    font-weight: 800;
    box-shadow: 0 5px 12px rgba(18, 59, 109, 0.2);
  }

  .companies-home-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 17px;
    border: 1px solid var(--border);
    border-radius: 30px;
    color: var(--primary);
    font-size: 14px;
    font-weight: 700;
    transition: all 0.25s ease;
  }

  .companies-home-link:hover {
    background: #edf4fc;
    border-color: #b9cce1;
    transform: translateY(-2px);
  }

  /* MAIN */
  .companies-main {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto;
    padding: 38px 0 60px;
    flex: 1;
  }

  /* HERO */
  .companies-hero {
    position: relative;
    overflow: hidden;
    min-height: 225px;
    display: flex;
    align-items: center;
    padding: 42px 40px;
    border-radius: 18px;
    background:
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.13), transparent 24%),
      linear-gradient(120deg, #102f55 0%, #174d82 55%, #24679e 100%);
    color: var(--white);
    box-shadow: 0 14px 35px rgba(18, 59, 109, 0.15);
  }

  .companies-hero::after {
    content: "";
    position: absolute;
    width: 290px;
    height: 290px;
    right: -55px;
    top: -125px;
    border: 42px solid rgba(255, 255, 255, 0.07);
    border-radius: 50%;
    pointer-events: none;
  }

  .companies-hero-content {
    position: relative;
    z-index: 1;
    max-width: 680px;
  }

  .companies-hero h1 {
    margin: 0 0 12px;
    font-size: clamp(32px, 4vw, 42px);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -1.1px;
  }

  .companies-hero p {
    margin: 0;
    max-width: 590px;
    color: rgba(255, 255, 255, 0.86);
    font-size: 16px;
    line-height: 1.8;
  }

  .companies-hero-accent {
    width: 65px;
    height: 5px;
    margin-top: 25px;
    border-radius: 5px;
    background: linear-gradient(90deg, #ff9d35, #ffd08b);
  }

  /* STATISTICS */
  .companies-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    margin: 30px 0 48px;
  }

  .companies-stat-card {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 125px;
    padding: 25px 28px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--white);
    box-shadow: 0 7px 24px rgba(18, 59, 109, 0.055);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .companies-stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 13px 30px rgba(18, 59, 109, 0.10);
  }

  .companies-stat-icon {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: linear-gradient(145deg, #edf5ff, #dceafa);
    font-size: 25px;
  }

  .companies-stat-card:nth-child(2) .companies-stat-icon {
    background: linear-gradient(145deg, #fff4e8, #ffe4c8);
  }

  .companies-stat-info {
    min-width: 0;
  }

  .companies-stat-value {
    display: block;
    margin-bottom: 5px;
    color: var(--primary);
    font-size: 32px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.8px;
  }

  .companies-stat-label {
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }

  /* COMPANY DIRECTORY */
  .companies-section {
    width: 100%;
  }

  .companies-section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 24px;
  }

  .companies-section-heading h2 {
    margin: 0;
    color: var(--primary);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .companies-section-line {
    width: 55px;
    height: 4px;
    margin-top: 10px;
    border-radius: 5px;
    background: var(--accent);
  }

  .companies-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }

  .company-card {
    position: relative;
    min-width: 0;
    min-height: 125px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 23px;
    border: 1px solid #e8edf4;
    border-radius: 17px;
    background: var(--white);
    box-shadow: 0 5px 20px rgba(18, 59, 109, 0.045);
    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease;
  }

  .company-card:hover {
    transform: translateY(-5px);
    border-color: #cbdced;
    box-shadow: 0 14px 30px rgba(18, 59, 109, 0.10);
  }

  .company-logo-wrap {
    width: 82px;
    height: 82px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: #fff;
    box-shadow: 0 3px 12px rgba(18, 59, 109, 0.055);
  }

  .company-logo {
    display: block;
    width: 100%;
    height: 100%;
    padding: 9px;
    object-fit: contain;
  }

  .company-logo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #edf5ff, #dceafa);
    color: #174d82;
    font-size: 29px;
    font-weight: 800;
  }

  .company-info {
    min-width: 0;
    flex: 1;
  }

  .company-name {
    overflow-wrap: anywhere;
    margin-bottom: 9px;
    color: var(--primary);
    font-size: 17px;
    line-height: 1.45;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .company-job-count {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 30px;
    background: #f0f5fb;
    color: #42617f;
    font-size: 12px;
    line-height: 1.5;
    font-weight: 600;
  }

  /* EMPTY / LOADING MESSAGE */
  .companies-message {
    margin-top: 15px;
    padding: 28px 20px;
    border: 1px dashed #c5d4e5;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.85);
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
  }

  /* FOOTER */
  .companies-footer {
    padding: 26px 20px;
    border-top: 1px solid var(--border);
    background: var(--white);
    color: #7b8999;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.1px;
  }

  /* TABLET AND MOBILE */
  @media (max-width: 700px) {
    .companies-header-inner {
      width: calc(100% - 30px);
      min-height: 68px;
    }

    .companies-brand {
      font-size: 18px;
    }

    .companies-brand-mark {
      width: 34px;
      height: 34px;
      font-size: 17px;
    }

    .companies-home-link {
      padding: 9px 12px;
      font-size: 13px;
    }

    .companies-main {
      width: calc(100% - 30px);
      padding: 25px 0 42px;
    }

    .companies-hero {
      min-height: 195px;
      padding: 30px 23px;
      border-radius: 15px;
    }

    .companies-hero h1 {
      font-size: 31px;
    }

    .companies-hero p {
      font-size: 14px;
    }

    .companies-stats {
      gap: 12px;
      margin: 20px 0 38px;
    }

    .companies-stat-card {
      min-height: 105px;
      gap: 11px;
      padding: 16px 13px;
    }

    .companies-stat-icon {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      font-size: 20px;
    }

    .companies-stat-value {
      font-size: 25px;
    }

    .companies-stat-label {
      font-size: 12px;
      line-height: 1.4;
    }

    .companies-section-heading h2 {
      font-size: 21px;
    }

    .companies-grid {
      grid-template-columns: 1fr;
      gap: 13px;
    }

    .company-card {
      min-height: 110px;
      gap: 14px;
      padding: 17px;
      border-radius: 15px;
    }

    .company-logo-wrap {
      width: 68px;
      height: 68px;
    }

    .company-name {
      font-size: 15px;
    }
  }

  /* SMALL MOBILE */
  @media (max-width: 360px) {
    .companies-stats {
      grid-template-columns: 1fr;
    }

    .companies-stat-card {
      min-height: 88px;
    }

    .companies-brand {
      font-size: 16px;
    }
  }

  /* REDUCED MOTION */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>

</head>

<body>

<div class="companies-page">

  <!-- HEADER -->
  <header class="companies-header">
    <div class="companies-header-inner">

      <a href="index.html" class="companies-brand" aria-label="Kerjiva Malaysia Home">
        <span class="companies-brand-mark">K</span>
        <span>Kerjiva Malaysia</span>
      </a>

      <a href="index.html" class="companies-home-link">
        <span aria-hidden="true">←</span>
        <span data-company-text="home">Home</span>
      </a>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="companies-main">

    <!-- HERO -->
    <section class="companies-hero">
      <div class="companies-hero-content">

        <h1 data-company-text="title">Companies</h1>

        <p data-company-text="subtitle">
          Discover companies registered on Kerjiva Malaysia.
        </p>

        <div class="companies-hero-accent"></div>

      </div>
    </section>

    <!-- STATISTICS -->
    <section class="companies-stats" aria-label="Company statistics">

      <div class="companies-stat-card">
        <div class="companies-stat-icon" aria-hidden="true">🏢</div>

        <div class="companies-stat-info">
          <span class="companies-stat-value" id="totalCompanies">0</span>
          <span class="companies-stat-label" data-company-text="totalCompanies">
            Total Companies
          </span>
        </div>
      </div>

      <div class="companies-stat-card">
        <div class="companies-stat-icon" aria-hidden="true">💼</div>

        <div class="companies-stat-info">
          <span class="companies-stat-value" id="totalPublishedJobs">0</span>
          <span class="companies-stat-label" data-company-text="totalJobs">
            Published Jobs
          </span>
        </div>
      </div>

    </section>

    <!-- COMPANY DIRECTORY -->
    <section class="companies-section">

      <div class="companies-section-heading">
        <div>
          <h2 data-company-text="listTitle">Explore Companies</h2>
          <div class="companies-section-line"></div>
        </div>
      </div>

      <div class="companies-grid" id="companiesGrid"></div>

      <div class="companies-message" id="companiesMessage">
        Loading companies...
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="companies-footer">
    © <span id="companiesYear"></span> Kerjiva Malaysia
  </footer>

</div>

<!-- SUPABASE & WEBSITE SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="language.js"></script>

<script>
(function () {
  "use strict";

  const supabaseAuth = window.supabaseAuth;
  const languageKey = "kerjivaMalaysiaLanguage";

  const translations = {
    en: {
      home: "Home",
      title: "Companies",
      subtitle: "Discover companies registered on Kerjiva Malaysia.",
      totalCompanies: "Total Companies",
      totalJobs: "Published Jobs",
      listTitle: "Explore Companies",
      loading: "Loading companies...",
      noCompanies: "No companies with published jobs yet.",
      loadError: "Unable to load companies. Please try again later.",
      jobCount: "published jobs"
    },

    ms: {
      home: "Laman Utama",
      title: "Syarikat",
      subtitle: "Kenali syarikat yang berdaftar di Kerjiva Malaysia.",
      totalCompanies: "Jumlah Syarikat",
      totalJobs: "Jawatan Diiklankan",
      listTitle: "Terokai Syarikat",
      loading: "Sedang memuatkan syarikat...",
      noCompanies: "Belum ada syarikat dengan jawatan yang diiklankan.",
      loadError: "Syarikat tidak dapat dimuatkan. Sila cuba lagi.",
      jobCount: "jawatan diiklankan"
    }
  };

  function getLanguage() {
    return localStorage.getItem(languageKey) === "ms" ? "ms" : "en";
  }

  function t(key) {
    return translations[getLanguage()][key] ||
           translations.en[key] ||
           key;
  }

  const companiesGrid = document.getElementById("companiesGrid");
  const companiesMessage = document.getElementById("companiesMessage");

  let companiesData = [];

  document.getElementById("companiesYear").textContent =
    new Date().getFullYear();

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character];
    });
  }

  function applyPageLanguage() {
    document.documentElement.lang = getLanguage();

    document.querySelectorAll("[data-company-text]").forEach(function (element) {
      const key = element.getAttribute("data-company-text");
      element.textContent = t(key);
    });

    renderCompanies();
  }

  async function loadStatistics() {
    const { data, error } = await supabaseAuth
      .from("company_directory_stats")
      .select("total_companies,total_published_jobs")
      .single();

    if (error) {
      console.error("Companies statistics error:", error);
      return;
    }

    document.getElementById("totalCompanies").textContent =
      data.total_companies ?? 0;

    document.getElementById("totalPublishedJobs").textContent =
      data.total_published_jobs ?? 0;
  }

  function renderCompanies() {
    companiesGrid.innerHTML = "";

    companiesData.forEach(function (company) {
      const card = document.createElement("article");
      card.className = "company-card";

      const logo = company.logo_url
        ? '<div class="company-logo-wrap">' +
            '<img class="company-logo" src="' +
            escapeHTML(company.logo_url) +
            '" alt="' + escapeHTML(company.company_name) +
            ' logo" loading="lazy">' +
          '</div>'
        : '<div class="company-logo-wrap">' +
            '<div class="company-logo-placeholder">' +
            escapeHTML((company.company_name || "C").charAt(0).toUpperCase()) +
            '</div>' +
          '</div>';

      card.innerHTML =
        logo +
        '<div class="company-info">' +
          '<div class="company-name">' +
            escapeHTML(company.company_name) +
          '</div>' +
          '<div class="company-job-count">' +
            '💼 ' +
            Number(company.published_jobs_count || 0) +
            " " + escapeHTML(t("jobCount")) +
          '</div>' +
        '</div>';

      companiesGrid.appendChild(card);
    });
  }

  async function loadCompanies() {
    const { data, error } = await supabaseAuth
      .from("company_directory")
      .select("id,company_name,logo_url,published_jobs_count")
      .order("company_name", { ascending: true });

    if (error) {
      console.error("Companies directory error:", error);
      companiesMessage.hidden = false;
      companiesMessage.textContent = t("loadError");
      return;
    }

    companiesData = data || [];

    companiesMessage.hidden = companiesData.length > 0;

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }

    renderCompanies();
  }

  function refreshLanguage() {
    applyPageLanguage();

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }
  }

  window.addEventListener("storage", function (event) {
    if (event.key === languageKey) {
      refreshLanguage();
    }
  });

  applyPageLanguage();

  if (supabaseAuth) {
    Promise.all([
      loadStatistics(),
      loadCompanies()
    ]);
  } else {
    companiesMessage.hidden = false;
    companiesMessage.textContent = t("loadError");
    console.error("Supabase client is not available.");
  }

})();
</script>

</body>
</html>
