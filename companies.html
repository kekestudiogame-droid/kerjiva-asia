
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Discover companies registered on Kerjiva Malaysia and explore their published job opportunities.">
  <meta name="theme-color" content="#123b6d">

  <title>Companies - Kerjiva Malaysia</title>

  <style>
    :root {
      --primary: #123b6d;
      --primary-light: #1d548d;
      --accent: #f28c28;
      --page-bg: #f3f6fa;
      --text: #243449;
      --muted: #718096;
      --white: #ffffff;
      --border: #e7edf4;
      --shadow: 0 8px 28px rgba(18, 59, 109, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .companies-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .companies-header {
      width: 100%;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .companies-header-inner {
      width: min(1120px, calc(100% - 40px));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .companies-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .companies-brand-mark {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--primary);
      color: var(--white);
      font-size: 19px;
      font-weight: 800;
    }

    .companies-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 17px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .companies-home-link:hover {
      background: #f1f6fc;
      border-color: #cbd9e8;
    }

    /* MAIN */
    .companies-main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 60px;
      flex: 1;
    }

    /* HERO */
    .companies-hero {
      position: relative;
      overflow: hidden;
      padding: 42px 40px;
      border-radius: 18px;
      background: linear-gradient(125deg, #123b6d 0%, #1d548d 100%);
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .companies-hero::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -65px;
      top: -105px;
      border: 35px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      pointer-events: none;
    }

    .companies-hero-content {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    .companies-hero h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .companies-hero p {
      margin: 0;
      max-width: 590px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 16px;
      line-height: 1.7;
    }

    .companies-hero-accent {
      width: 52px;
      height: 4px;
      margin-top: 22px;
      border-radius: 5px;
      background: var(--accent);
    }

    /* STATISTICS */
    .companies-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 28px 0 42px;
    }

    .companies-stat-card {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 112px;
      padding: 23px 25px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .companies-stat-icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #edf4fc;
      font-size: 25px;
    }

    .companies-stat-card:nth-child(2) .companies-stat-icon {
      background: #fff3e7;
    }

    .companies-stat-info {
      min-width: 0;
    }

    .companies-stat-value {
      display: block;
      margin-bottom: 5px;
      color: var(--primary);
      font-size: 29px;
      line-height: 1;
      font-weight: 800;
    }

    .companies-stat-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    /* COMPANY DIRECTORY */
    .companies-section {
      width: 100%;
    }

    .companies-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .companies-section-heading h2 {
      margin: 0;
      color: var(--primary);
      font-size: 23px;
      font-weight: 800;
    }

    .companies-section-line {
      width: 48px;
      height: 3px;
      margin-top: 10px;
      border-radius: 5px;
      background: var(--accent);
    }

    .companies-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .company-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
      box-shadow: 0 4px 18px rgba(18, 59, 109, 0.045);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .company-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .company-logo-wrap {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #ffffff;
    }

    .company-logo {
      display: block;
      width: 100%;
      height: 100%;
      padding: 7px;
      object-fit: contain;
    }

    .company-logo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf4fc;
      color: var(--primary);
      font-size: 29px;
      font-weight: 800;
    }

    .company-info {
      min-width: 0;
      flex: 1;
    }

    .company-name {
      overflow-wrap: anywhere;
      margin-bottom: 9px;
      color: var(--primary);
      font-size: 16px;
      line-height: 1.4;
      font-weight: 800;
    }

    .company-job-count {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
    }

    /* MESSAGE */
    .companies-message {
      margin-top: 15px;
      padding: 28px 20px;
      border: 1px dashed #cbd8e6;
      border-radius: 13px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    /* FOOTER */
    .companies-footer {
      padding: 23px 20px;
      border-top: 1px solid var(--border);
      background: var(--white);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      .companies-header-inner {
        width: calc(100% - 30px);
        min-height: 68px;
      }

      .companies-brand {
        font-size: 18px;
      }

      .companies-brand-mark {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }

      .companies-home-link {
        padding: 9px 12px;
        font-size: 13px;
      }

      .companies-main {
        width: calc(100% - 30px);
        padding: 25px 0 42px;
      }

      .companies-hero {
        padding: 32px 24px;
        border-radius: 15px;
      }

      .companies-hero p {
        font-size: 14px;
      }

      .companies-stats {
        gap: 12px;
        margin: 20px 0 34px;
      }

      .companies-stat-card {
        min-height: 100px;
        gap: 11px;
        padding: 16px 13px;
      }

      .companies-stat-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        font-size: 20px;
      }

      .companies-stat-value {
        font-size: 24px;
      }

      .companies-stat-label {
        font-size: 12px;
        line-height: 1.4;
      }

      .companies-section-heading h2 {
        font-size: 20px;
      }

      .companies-grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .company-card {
        gap: 14px;
        padding: 17px;
      }

      .company-logo-wrap {
        width: 66px;
        height: 66px;
      }

      .company-name {
        font-size: 15px;
      }
    }

    @media (max-width: 360px) {
      .companies-stats {
        grid-template-columns: 1fr;
      }

      .companies-stat-card {
        min-height: 88px;
      }

      .companies-brand {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

<div class="companies-page">

  <!-- HEADER -->
  <header class="companies-header">
    <div class="companies-header-inner">

      <a href="index.html" class="companies-brand" aria-label="Kerjiva Malaysia Home">
        <span class="companies-brand-mark">K</span>
        <span>Kerjiva Malaysia</span>
      </a>

      <a href="index.html" class="companies-home-link">
        <span aria-hidden="true">←</span>
        <span data-company-text="home">Home</span>
      </a>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="companies-main">

    <!-- HERO -->
    <section class="companies-hero">
      <div class="companies-hero-content">

        <h1 data-company-text="title">Companies</h1>

        <p data-company-text="subtitle">
          Discover companies registered on Kerjiva Malaysia.
        </p>

        <div class="companies-hero-accent"></div>

      </div>
    </section>

    <!-- STATISTICS -->
    <section class="companies-stats" aria-label="Company statistics">

      <div class="companies-stat-card">
        <div class="companies-stat-icon" aria-hidden="true">🏢</div>

        <div class="companies-stat-info">
          <span class="companies-stat-value" id="totalCompanies">0</span>
          <span class="companies-stat-label" data-company-text="totalCompanies">
            Total Companies
          </span>
        </div>
      </div>

      <div class="companies-stat-card">
        <div class="companies-stat-icon" aria-hidden="true">💼</div>

        <div class="companies-stat-info">
          <span class="companies-stat-value" id="totalPublishedJobs">0</span>
          <span class="companies-stat-label" data-company-text="totalJobs">
            Published Jobs
          </span>
        </div>
      </div>

    </section>

    <!-- COMPANY DIRECTORY -->
    <section class="companies-section">

      <div class="companies-section-heading">
        <div>
          <h2 data-company-text="listTitle">Explore Companies</h2>
          <div class="companies-section-line"></div>
        </div>
      </div>

      <div class="companies-grid" id="companiesGrid"></div>

      <div class="companies-message" id="companiesMessage">
        Loading companies...
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="companies-footer">
    © <span id="companiesYear"></span> Kerjiva Malaysia
  </footer>

</div>

<!-- SUPABASE & WEBSITE SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="language.js"></script>

<script>
(function () {
  "use strict";

  const supabaseAuth = window.supabaseAuth;
  const languageKey = "kerjivaMalaysiaLanguage";

  const translations = {
    en: {
      home: "Home",
      title: "Companies",
      subtitle: "Discover companies registered on Kerjiva Malaysia.",
      totalCompanies: "Total Companies",
      totalJobs: "Published Jobs",
      listTitle: "Explore Companies",
      loading: "Loading companies...",
      noCompanies: "No companies with published jobs yet.",
      loadError: "Unable to load companies. Please try again later.",
      jobCount: "published jobs"
    },

    ms: {
      home: "Laman Utama",
      title: "Syarikat",
      subtitle: "Kenali syarikat yang berdaftar di Kerjiva Malaysia.",
      totalCompanies: "Jumlah Syarikat",
      totalJobs: "Jawatan Diiklankan",
      listTitle: "Terokai Syarikat",
      loading: "Sedang memuatkan syarikat...",
      noCompanies: "Belum ada syarikat dengan jawatan yang diiklankan.",
      loadError: "Syarikat tidak dapat dimuatkan. Sila cuba lagi.",
      jobCount: "jawatan diiklankan"
    }
  };

  function getLanguage() {
    return localStorage.getItem(languageKey) === "ms" ? "ms" : "en";
  }

  function t(key) {
    return translations[getLanguage()][key] ||
           translations.en[key] ||
           key;
  }

  const companiesGrid = document.getElementById("companiesGrid");
  const companiesMessage = document.getElementById("companiesMessage");

  let companiesData = [];

  document.getElementById("companiesYear").textContent =
    new Date().getFullYear();

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character];
    });
  }

  function applyPageLanguage() {
    document.documentElement.lang = getLanguage();

    document.querySelectorAll("[data-company-text]").forEach(function (element) {
      const key = element.getAttribute("data-company-text");
      element.textContent = t(key);
    });

    renderCompanies();
  }

  async function loadStatistics() {
    const { data, error } = await supabaseAuth
      .from("company_directory_stats")
      .select("total_companies,total_published_jobs")
      .single();

    if (error) {
      console.error("Companies statistics error:", error);
      return;
    }

    document.getElementById("totalCompanies").textContent =
      data.total_companies ?? 0;

    document.getElementById("totalPublishedJobs").textContent =
      data.total_published_jobs ?? 0;
  }

  function renderCompanies() {
    companiesGrid.innerHTML = "";

    companiesData.forEach(function (company) {
      const card = document.createElement("article");
      card.className = "company-card";

      const logo = company.logo_url
        ? '<div class="company-logo-wrap">' +
            '<img class="company-logo" src="' +
            escapeHTML(company.logo_url) +
            '" alt="' + escapeHTML(company.company_name) +
            ' logo" loading="lazy">' +
          '</div>'
        : '<div class="company-logo-wrap">' +
            '<div class="company-logo-placeholder">' +
            escapeHTML((company.company_name || "C").charAt(0).toUpperCase()) +
            '</div>' +
          '</div>';

      card.innerHTML =
        logo +
        '<div class="company-info">' +
          '<div class="company-name">' +
            escapeHTML(company.company_name) +
          '</div>' +
          '<div class="company-job-count">' +
            '💼 ' +
            Number(company.published_jobs_count || 0) +
            " " + escapeHTML(t("jobCount")) +
          '</div>' +
        '</div>';

      companiesGrid.appendChild(card);
    });
  }

  async function loadCompanies() {
    const { data, error } = await supabaseAuth
      .from("company_directory")
      .select("id,company_name,logo_url,published_jobs_count")
      .order("company_name", { ascending: true });

    if (error) {
      console.error("Companies directory error:", error);
      companiesMessage.hidden = false;
      companiesMessage.textContent = t("loadError");
      return;
    }

    companiesData = data || [];

    companiesMessage.hidden = companiesData.length > 0;

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }

    renderCompanies();
  }

  function refreshLanguage() {
    applyPageLanguage();

    if (companiesData.length === 0) {
      companiesMessage.textContent = t("noCompanies");
    }
  }

  window.addEventListener("storage", function (event) {
    if (event.key === languageKey) {
      refreshLanguage();
    }
  });

  applyPageLanguage();

  if (supabaseAuth) {
    Promise.all([
      loadStatistics(),
      loadCompanies()
    ]);
  } else {
    companiesMessage.hidden = false;
    companiesMessage.textContent = t("loadError");
    console.error("Supabase client is not available.");
  }

})();
</script>

</body>
</html>
