
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your Kerjiva Malaysia account password.">

  <meta name="theme-color" content="#123b6d">

  <title>Forgot Password - Kerjiva Malaysia</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <div class="auth-card">

      <!-- BRAND -->
      <div class="auth-brand">
        <a href="index.html" class="logo">
          Kerjiva
          <small>Malaysia</small>
        </a>

        <p>Your Career Starts Here.</p>
      </div>

      <!-- PAGE HEADING -->
      <div class="auth-heading">
        <h1>Forgot Password?</h1>
        <p>
          Enter your registered email address.
          We will send you a link to reset your password.
        </p>
      </div>

      <!-- FORGOT PASSWORD FORM -->
      <form id="forgotPasswordForm">

        <div class="auth-form-group">
          <label for="forgotPasswordEmail">Email Address</label>

          <input
            type="email"
            id="forgotPasswordEmail"
            name="email"
            placeholder="Enter your registered email address"
            autocomplete="email"
            required
          >
        </div>

        <button
          type="submit"
          id="forgotPasswordSubmitBtn"
          class="auth-submit-btn"
        >
          Send Reset Link
        </button>

        <p
          id="forgotPasswordStatus"
          class="auth-status"
          aria-live="polite"
        ></p>

      </form>

      <!-- BACK TO LOGIN -->
      <div class="auth-footer">
        <p>
          Remember your password?
          <a href="login.html">Log In</a>
        </p>
      </div>

      <!-- BACK TO HOME -->
      <div class="auth-back-home">
        <a href="index.html">
          ← Back to Home
        </a>
      </div>

    </div>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- KERJIVA MALAYSIA APP -->
  <script src="app.js"></script>

</body>
</html>
