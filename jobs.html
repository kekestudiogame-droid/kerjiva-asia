
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#123b6d">
  <link rel="icon" type="image/png" href="./kerjiva-favicon.png">

  <meta
    name="description"
    content="Explore job opportunities from companies across Malaysia on Kerjiva."
  >

  <title>All Job Opportunities - Kerjiva Malaysia</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <div class="container header-content">

    <a href="index.html" class="logo">
      <img src="kerjiva.jpg.png" alt="Kerjiva Logo">
      <small>Malaysia</small>
    </a>

    <div class="header-actions">

      <a href="index.html" class="login-btn">
        Home
      </a>

      <a href="login.html" class="login-btn" data-i18n="auth_login">
        Log In
      </a>

      <a href="register.html" class="register-btn" data-i18n="auth_register">
        Sign Up
      </a>

    </div>

  </div>
</header>


<main>

  <!-- PAGE HEADING -->
  <section class="jobs-section">

    <div class="container">

      <div class="section-heading">
        <div>
          <span class="section-label">
            CAREER OPPORTUNITIES
          </span>

          <h1 id="allJobsPageTitle">
            All Job Opportunities
          </h1>

          <p id="allJobsPageDescription">
            Explore available job opportunities from companies across Malaysia.
          </p>
        </div>
      </div>


      <!-- JOB SEARCH -->
      <div class="search-box" id="allJobsSearchBox">

        <div class="search-field">
          <label for="allJobsKeyword">
            Job Title or Keyword
          </label>

          <input
            type="text"
            id="allJobsKeyword"
            placeholder="e.g. Marketing Executive"
          >
        </div>


        <div class="search-field">
          <label for="allJobsLocation">
            Location
          </label>

          <select id="allJobsLocation">
            <option value="">All Locations</option>
            <option value="Johor">Johor</option>
            <option value="Kedah">Kedah</option>
            <option value="Kelantan">Kelantan</option>
            <option value="Kuala Lumpur">Kuala Lumpur</option>
            <option value="Labuan">Labuan</option>
            <option value="Melaka">Melaka</option>
            <option value="Negeri Sembilan">Negeri Sembilan</option>
            <option value="Pahang">Pahang</option>
            <option value="Penang">Penang</option>
            <option value="Perak">Perak</option>
            <option value="Perlis">Perlis</option>
            <option value="Putrajaya">Putrajaya</option>
            <option value="Sabah">Sabah</option>
            <option value="Sarawak">Sarawak</option>
            <option value="Selangor">Selangor</option>
            <option value="Terengganu">Terengganu</option>
          </select>
        </div>


        <div class="search-field">
          <label for="allJobsCategory">
            Job Category
          </label>

          <select id="allJobsCategory">
            <option value="">All Categories</option>
          </select>
        </div>


        <div class="search-field">
          <label for="allJobsType">
            Job Type
          </label>

          <select id="allJobsType">
            <option value="">All Job Types</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Temporary">Temporary</option>
            <option value="Internship">Internship</option>
            <option value="Freelance">Freelance</option>
            <option value="Casual">Casual</option>
            <option value="Apprenticeship">Apprenticeship</option>
            <option value="Graduate Programme">Graduate Programme</option>
          </select>
        </div>


        <button
          type="button"
          id="allJobsSearchBtn"
          class="search-btn"
        >
          Search Jobs
        </button>

      </div>


      <!-- JOB RESULTS -->
      <div class="section-heading">

        <div>
          <h2 id="allJobsResultsTitle">
            Available Jobs
          </h2>

          <p id="allJobsResultCount">
            Loading job opportunities...
          </p>
        </div>

      </div>


      <div
        id="allJobsGrid"
        class="jobs-grid"
        aria-live="polite"
      >

        <div class="loading-jobs">
          Loading job opportunities...
        </div>

      </div>

    </div>

  </section>

</main>


<!-- FOOTER -->
<footer class="main-footer">

  <div class="container footer-content">

    <p>
      © Kerjiva Malaysia
    </p>

    <a href="index.html">
      Back to Home
    </a>

  </div>

</footer>


<!-- SUPABASE AND EXISTING SYSTEM -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="language.js"></script>

</body>
</html>
