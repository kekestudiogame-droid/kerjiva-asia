
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your Kerjiva Malaysia account password.">

  <meta name="theme-color" content="#123b6d">

  <title>Reset Password - Kerjiva Malaysia</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <div class="auth-card">

      <!-- BRAND -->
      <div class="auth-brand">
        <a href="index.html" class="logo">
          Kerjiva
          <small>Malaysia</small>
        </a>

        <p>Your Career Starts Here.</p>
      </div>

      <!-- PAGE HEADING -->
      <div class="auth-heading">
        <h1>Reset Your Password</h1>
        <p>
          Enter your new password below to regain access
          to your Kerjiva account.
        </p>
      </div>

      <!-- RESET PASSWORD FORM -->
      <form id="resetPasswordForm">

        <div class="auth-form-group">
          <label for="resetPassword">New Password</label>

          <input
            type="password"
            id="resetPassword"
            name="password"
            placeholder="Enter your new password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="auth-form-group">
          <label for="confirmResetPassword">Confirm New Password</label>

          <input
            type="password"
            id="confirmResetPassword"
            name="confirmPassword"
            placeholder="Confirm your new password"
            autocomplete="new-password"
            required
          >
        </div>

        <button
          type="submit"
          id="resetPasswordSubmitBtn"
          class="auth-submit-btn"
        >
          Update Password
        </button>

        <p
          id="resetPasswordStatus"
          class="auth-status"
          aria-live="polite"
        ></p>

      </form>

      <!-- BACK TO LOGIN -->
      <div class="auth-footer">
        <p>
          Remember your password?
          <a href="login.html">Log In</a>
        </p>
      </div>

      <!-- BACK TO HOME -->
      <div class="auth-back-home">
        <a href="index.html">
          ← Back to Home
        </a>
      </div>

    </div>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- KERJIVA MALAYSIA APP -->
  <script src="app.js"></script>

</body>
</html>
