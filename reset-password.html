
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your Kerjiva Malaysia account password.">

  <meta name="theme-color" content="#123b6d">

  <title>Reset Password - Kerjiva Malaysia</title>

  <link rel="stylesheet" href="styles.css">
  
<style>
  /* RESET PASSWORD NOTIFICATION */

  #kerjivaNotification {
    position: fixed !important;
    top: 24px !important;
    left: 50% !important;
    right: auto !important;
    width: max-content !important;
    max-width: calc(100% - 32px) !important;
    text-align: center !important;
    z-index: 100000 !important;
    transform: translate(-50%, -10px) !important;
  }

  #kerjivaNotification.show {
    transform: translate(-50%, 0) !important;
  }

  #kerjivaNotification.success {
    background: #198754 !important;
  }

  #resetPasswordStatus {
    display: none;
  }

  @media (max-width: 600px) {
    #kerjivaNotification {
      top: 16px !important;
      left: 16px !important;
      right: 16px !important;
      width: auto !important;
      max-width: none !important;
      transform: translateY(-10px) !important;
    }

    #kerjivaNotification.show {
      transform: translateY(0) !important;
    }
  }
</style>

</head>

<body class="auth-page">

  <main class="auth-container">

    <div class="auth-card">

      <!-- BRAND -->
      <div class="auth-brand">
        <a href="index.html" class="logo">
          Kerjiva
          <small>Malaysia</small>
        </a>

        <p>Your Career Starts Here.</p>
      </div>

      <!-- PAGE HEADING -->
      <div class="auth-heading">
        <h1>Reset Your Password</h1>
        <p>
          Enter your new password below to regain access
          to your Kerjiva account.
        </p>
      </div>

      <!-- RESET PASSWORD FORM -->
      <form id="resetPasswordForm">

       
<div class="auth-form-group">
  <label for="resetPassword">New Password</label>

  <div class="password-input-wrapper" style="position: relative;">
    <input
      type="password"
      id="resetPassword"
      name="password"
      placeholder="Enter your new password"
      autocomplete="new-password"
      required
      style="padding-right: 50px;"
    >

    <button
      type="button"
      class="password-toggle-btn"
      data-password-target="resetPassword"
      aria-label="Show password"
      style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: none; background: transparent; cursor: pointer; padding: 5px; color: #64748b;"
    >
      <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>

<div class="auth-form-group">
  <label for="confirmResetPassword">Confirm New Password</label>

  <div class="password-input-wrapper" style="position: relative;">
    <input
      type="password"
      id="confirmResetPassword"
      name="confirmPassword"
      placeholder="Confirm your new password"
      autocomplete="new-password"
      required
      style="padding-right: 50px;"
    >

    <button
      type="button"
      class="password-toggle-btn"
      data-password-target="confirmResetPassword"
      aria-label="Show password"
      style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: none; background: transparent; cursor: pointer; padding: 5px; color: #64748b;"
    >
      <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>

        <button
          type="submit"
          id="resetPasswordSubmitBtn"
          class="auth-submit-btn"
        >
          Update Password
        </button>

        <p
          id="resetPasswordStatus"
          class="auth-status"
          aria-live="polite"
        ></p>

      </form>

      <!-- BACK TO LOGIN -->
      <div class="auth-footer">
        <p>
          Remember your password?
          <a href="login.html">Log In</a>
        </p>
      </div>

      <!-- BACK TO HOME -->
      <div class="auth-back-home">
        <a href="index.html">
          ← Back to Home
        </a>
      </div>

    </div>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- KERJIVA MALAYSIA APP -->
  <script src="app.js"></script>

</body>
</html>
